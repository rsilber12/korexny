<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f4ef"><meta name="description" content="Korex Property Development Services">
<title>Korenx</title>
<style>
:root{color-scheme:light;--background:#f5f4ef;--ink:#24312b;--gold:#a57b40}*{box-sizing:border-box}html{height:100%;background:var(--background)}body{margin:0;min-height:100svh;color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 32px;gap:110px}.brand{text-align:center;width:min(100%,734px)}.logo{display:block;width:100%;height:auto}h1{font-size:clamp(.75rem,1.3vw,1.25rem);font-weight:400;letter-spacing:.22em;line-height:1.6;margin:36px 0 0;text-transform:uppercase}.services{display:grid;grid-template-columns:repeat(3,1fr);width:min(100%,1000px);gap:70px;margin:0;padding:0;list-style:none}.service{display:flex;align-items:center;justify-content:center;gap:18px;white-space:nowrap;font-size:.875rem;letter-spacing:.45em;line-height:1.5}.service img{width:38px;height:36px;object-fit:contain;flex:none}.service:first-child img{width:30px}.service:last-child img{width:32px}@media(min-width:1100px){main{padding-top:120px}}@media(max-width:760px){main{gap:70px;padding:64px 28px}.brand{max-width:560px}h1{margin-top:24px;letter-spacing:.16em}.services{grid-template-columns:1fr;gap:34px;width:auto}.service{justify-content:flex-start;font-size:.875rem;letter-spacing:.32em;gap:22px}.service img,.service:first-child img,.service:last-child img{width:38px;height:36px}}@media(max-width:360px){main{padding:48px 20px}h1{font-size:.6875rem}.service{font-size:.8125rem;letter-spacing:.24em}}

.service img,.service:first-child img,.service:last-child img{width:auto;max-width:100%;height:36px;object-fit:contain}.service{min-width:0}.services{gap:45px}@media(max-width:760px){.services{width:min(100%,289px);gap:34px}.service{justify-content:flex-start}.service img,.service:first-child img,.service:last-child img{height:auto;width:auto;max-height:36px;max-width:100%}}
</style>
</head>
<body><main><header class="brand"><img class="logo" src="assets/logo.png" alt="Korenx" width="2202" height="435"><h1>Property Development Services</h1></header><ul class="services" aria-label="Our services"><li class="service"><img src="assets/geotechnical-original.png" alt="Geotechnical" width="867" height="108"></li><li class="service"><img src="assets/monitoring-original.png" alt="Monitoring" width="783" height="108"></li><li class="service"><img src="assets/surveying-original.png" alt="Surveying" width="672" height="108"></li></ul></main></body>
</html>
